[project]
name = "trader-core"
version = "0.1.0"
description = "Kendi islem motorumuz (trader_engine) ve saf cekirdek (trader_core)"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "numpy>=1.26", "pyarrow>=15", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest", "pyyaml"]          # pyyaml: tests/test_compose.py (silme adiminda kalkar)
live = ["websockets>=12"]            # Faz B; Faz A'da kurulmaz

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: uzun suren testler (veri yoksa atlanir)"]
