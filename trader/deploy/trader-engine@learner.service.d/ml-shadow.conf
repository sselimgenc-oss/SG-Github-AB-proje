# ML golge deneyi (docs/ml/ml-golge-deney-spec.md): YALNIZ kagit ogrenen birimi config/engine.paper-ml.json katmanini ekler.
# Ikiz, testnet ve canli birimleri degismez. Geri almak icin bu dosyayi silip `systemctl daemon-reload && systemctl restart trader-engine@learner`.
[Service]
ExecStartPre=
ExecStartPre=/bin/sh -c 'i=0; while [ ! -e var/market.sqlite ] && [ $i -lt 60 ]; do i=$((i+1)); sleep 1; done; [ -e var/market.sqlite ]'
ExecStartPre=/usr/bin/python3 -m trader_engine init-ledger --bot %i --env paper-ml --config-dir config
ExecStart=
ExecStart=/usr/bin/python3 -m trader_engine run --bot %i --env paper-ml --config-dir config
