# Trader journald boyut siniri (1L3A deploy/1l3a-journald.conf'tan uyarlandi).
# install.sh bunu /etc/systemd/journald.conf.d/trader.conf olarak kurar (idempotent; yalniz icerik degistiyse journald yeniden baslar).
# Eski kayitlar silinir, yeni kayitlar durmaz: sinir asilinca journald en eski dosyalari atar.
[Journal]
SystemMaxUse=300M
SystemKeepFree=1G
MaxRetentionSec=30day
